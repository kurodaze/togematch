services:
  togematch-api:
    build:
      context: .
      args:
        PROFILE: dev
    container_name: togematch-api-dev
    restart: unless-stopped
    init: true
    # must own data/: your `id -u`:`id -g` if that isn't 1000
    user: "1000:1000"
    # userns_mode: keep-id   # rootless Podman
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "7094:7094"
    volumes:
      - ./data:/app/data:Z
