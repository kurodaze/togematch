[package]
name = "togematch-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP API and CLI for togematch, storing its matches, for the local network"
repository.workspace = true
publish = false

[dependencies]
flate2 = "1"
httparse = "1"
httpdate = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
togematch = { path = ".." }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
ureq = "3"
